AWSTemplateFormatVersion: "2010-09-09"
Description: HOPE Platform - EC2 free-tier deployment with Docker Compose

Parameters:
  GitHubRepo:
    Type: String
    Default: https://github.com/JayaPrathiba/Engagement-Intelligence-Platform.git
    Description: GitHub repository URL
  GitBranch:
    Type: String
    Default: devops
    Description: Git branch to deploy

Resources:
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HOPE Platform - HTTP and SSH access
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  AppServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: ami-0f88e80871fd81e91
      SecurityGroupIds:
        - !Ref AppSecurityGroup
      IamInstanceProfile: !Ref InstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: HOPE-Platform
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          yum update -y
          yum install -y docker git
          systemctl enable docker
          systemctl start docker
          usermod -aG docker ec2-user
          curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-Linux-x86_64" -o /usr/local/bin/docker-compose
          chmod +x /usr/local/bin/docker-compose
          dd if=/dev/zero of=/swapfile bs=1M count=2048
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile swap swap defaults 0 0' >> /etc/fstab
          cd /home/ec2-user
          git clone -b ${GitBranch} ${GitHubRepo} app
          chown -R ec2-user:ec2-user app
          cd app/infra
          docker-compose -f docker-compose.prod.yml up -d --build

Outputs:
  AppURL:
    Description: Application URL
    Value: !Sub http://${AppServer.PublicIp}
  PublicIP:
    Description: EC2 public IP
    Value: !GetAtt AppServer.PublicIp
