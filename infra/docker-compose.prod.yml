version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hope_platform
      POSTGRES_USER: hope_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-HopeSecure2024}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hope_user -d hope_platform"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-HopeRedis2024}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-HopeRedis2024}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../backend-api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://hope_user:${DB_PASSWORD:-HopeSecure2024}@postgres:5432/hope_platform?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-HopeRedis2024}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-hope-jwt-secret-change-this-in-production-64chars}
      TOKEN_HASH_SECRET: ${TOKEN_HASH_SECRET:-hope-token-hash-change-this-64chars}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY_DAYS: 7
      JWT_REFRESH_ABSOLUTE_CEILING_DAYS: 30
      JWT_REFRESH_GRACE_WINDOW_SECONDS: 10
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  redisdata:
