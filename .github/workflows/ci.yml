name: CI — Build, Test & Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  # Backend — typecheck, build, test
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend-api/package-lock.json
      - run: npm ci
      - run: npx prisma generate --schema=src/prisma/schema.prisma
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --passWithNoTests

  # Frontend — typecheck, build
  frontend:
    name: Frontend — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # Security — dependency audit + secret scan + container scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Backend dependency audit
        working-directory: backend-api
        run: npm audit --audit-level=high || true

      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high || true

      - name: Trivy — vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH

      - name: Trivy — IaC security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: infra/
          format: table
          severity: CRITICAL,HIGH

      - name: TruffleHog — secret detection
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # Docker — verify images build
  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t hope-backend:test ./backend-api
      - name: Build frontend image
        run: docker build -t hope-frontend:test --build-arg VITE_API_BASE_URL=/api ./frontend
